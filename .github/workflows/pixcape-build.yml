name: Pixcape Web Build

on:
  push:
    branches:
      - master
      - pixcape/skin-cape-editor
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pixcape-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web application
        run: npm run build-web
      - name: Verify web bundle
        run: test -s dist/bundle.js